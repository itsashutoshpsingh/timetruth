name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      # Re-classify the committed tool events against the committed truth and check
      # the published table still follows from them.
      - run: python compare/diff.py --out /tmp/classified.csv && cmp <(sort /tmp/classified.csv) <(sort results/classified.csv)
        shell: bash
